name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar workspaces
        run: npm ci

      - name: Typecheck shared
        run: npm run typecheck --workspace @habitos/shared

      - name: Typecheck mobile
        run: npm run typecheck --workspace @habitos/mobile

      - name: Tests (Jest)
        run: npm test --workspace @habitos/mobile
